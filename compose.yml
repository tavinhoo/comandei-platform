services:
  postgres:
    image: postgres:15-alpine
    container_name: cmdi-db
    environment:
      POSTGRES_DB: comandei
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_HOST_AUTH_METHOD: trust
      TZ: America/Sao_Paulo
    ports:
      - "${POSTGRES_PORT:-5434}:5432"
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    restart: unless-stopped
    networks:
      - comandei-network

  cmdi-api:
    build:
      context: ./api
      target: dev
    container_name: cmdi-api
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/comandei
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD}
      SPRING_JPA_HIBERNATE_DDL_AUTO: validate
      SPRING_FLYWAY_ENABLED: "true"
      APP_JWT_SECRET: ${APP_JWT_SECRET}
      APP_SEED_ENABLED: ${APP_SEED_ENABLED:-false}
      APP_SEED_DEFAULT_PASSWORD: ${APP_SEED_DEFAULT_PASSWORD:-}
      TZ: America/Sao_Paulo
    ports:
      - "8080:8080"
    volumes:
      - maven_cache:/root/.m2
    restart: unless-stopped
    networks:
      - comandei-network
    develop:
      watch:
        - path: ./api/src
          action: rebuild
        - path: ./api/pom.xml
          action: rebuild

  cmdi-web:
    build:
      context: ./web
      target: dev
    container_name: cmdi-web
    ports:
      - "${WEB_PORT:-5174}:5173"
    depends_on:
      - cmdi-api
    environment:
      VITE_API_URL: http://cmdi-api:8080
      TZ: America/Sao_Paulo
    volumes:
      - web_node_modules:/app/node_modules
    restart: unless-stopped
    networks:
      - comandei-network
    develop:
      watch:
        - path: ./web/src
          action: sync
          target: /app/src
        - path: ./web/public
          action: sync
          target: /app/public
        - path: ./web/vite.config.ts
          action: sync
          target: /app/vite.config.ts
        - path: ./web/package.json
          action: rebuild
        - path: ./web/package-lock.json
          action: rebuild

volumes:
  db_data:
  maven_cache:
  web_node_modules:

networks:
  comandei-network:
    driver: bridge
